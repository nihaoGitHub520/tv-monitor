name: 云构建 Debug APK

# 触发方式：
#   1. 任何分支 push 代码后自动触发
#   2. GitHub 网页仓库页 → Actions → 手动 Run workflow
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: 单元测试 + 编译 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17（AGP 8.7 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK（compileSdk 35 + Build-Tools 35.0.0）
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          fi
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: 生成 Gradle Wrapper（仓库未含 gradle-wrapper.jar，此处补齐）
        run: gradle wrapper --gradle-version 8.10.2

      - name: 运行单元测试（84 项门禁）
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: 编译 Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: 上传 APK 产物（保留 14 天）
        uses: actions/upload-artifact@v4
        with:
          name: tv-monitor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
