name: 云构建 Debug APK

# 触发方式：
#   1. 任何分支 push 代码后自动触发
#   2. GitHub 网页仓库页 → Actions → 手动 Run workflow
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: 单元测试 + 编译 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17（AGP 8.7 要求）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 准备 Android SDK（compileSdk 35 + Build-Tools 35.0.0）
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          fi
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: 生成 Gradle Wrapper（仓库未含 gradle-wrapper.jar，此处补齐）
        run: gradle wrapper --gradle-version 8.10.2

      - name: 运行单元测试（84 项门禁）
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: 编译 Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: 上传 APK 产物（保留 14 天）
        uses: actions/upload-artifact@v4
        with:
          name: tv-monitor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 GitHub Release
    needs: build
    # 仅 main 分支构建发布；功能分支只跑测试与编译
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许 GITHUB_TOKEN 创建/删除 Release
    steps:
      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: tv-monitor-apk

      - name: 创建/更新 Release（固定 tag v1.0.0，始终指向最新构建）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="tv-monitor-1.0.0-debug-b${{ github.run_number }}.apk"
          # download-artifact v4 会把产物放入以 artifact 名命名的子目录，用 find 兜底定位
          SRC=$(find . -name "app-debug.apk" -type f | head -1)
          if [ -z "$SRC" ]; then echo "::error::未找到 app-debug.apk，当前目录结构："; ls -R .; exit 1; fi
          mv "$SRC" "$APK"
          # 同名 tag 先删后建，保持 Release 链接稳定（releases/tag/v1.0.0）
          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0.0 "$APK" \
            --title "tv-monitor v1.0.0 · build ${{ github.run_number }}" \
            --notes "自动构建发布（commit ${GITHUB_SHA::7}）。

          ### 安装
          U 盘拷贝 APK 到电视/盒子 → 允许未知来源 → 安装。

          ### 本次变更
          - 修复：退出单预览返回四分格后恢复播放（不再暂停）
          - 修复：返回后画面重新适配格位尺寸
          - 新增：播放比例选项（原比例 / 16:9 / 拉伸）
          - 新增：键盘鼠标操作支持（Esc/Del 返回、1-4 选格、M 菜单、S 设置、空格暂停、滚轮切路/移焦点）"
